name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run rating tests
        run: npm test

      - name: Check application and PWA files
        run: npm run check

      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.51.1

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Test mobile application flows
        run: node scripts/browser-ci.cjs
